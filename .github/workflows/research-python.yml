name: Research labs (Python)
# Optional, non-required check for the isolated NautilusTrader / Freqtrade research labs. Runs only when lab files
# change, or on demand. Nautilus is fully offline; the Freqtrade backtest uses synthetic candles but loads Kraken's
# public market list (no keys). Nothing here can place an order.
on:
  workflow_dispatch:
  pull_request:
    paths: ['research/python/**', 'scripts/research-python.sh', '.github/workflows/research-python.yml']
permissions:
  contents: read
concurrency:
  group: research-python-${{ github.ref }}
  cancel-in-progress: true
jobs:
  labs:
    name: Nautilus + Freqtrade smoke (dry-run, simulated)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: scripts/research-python.sh setup all
      - run: scripts/research-python.sh smoke all
