name: CI
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Typecheck, unit tests, audit, secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Secret scan
        run: node scripts/secret-scan.mjs
      - name: Dependency audit (fail on high/critical)
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Production build (web + compiled server)
        run: npm run build
      - name: Unit & integration tests (offline, deterministic)
        run: npm run qa -w server
      - name: Web unit tests (status ribbon model)
        run: npm test -w web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: data/qa/test-results.json
  e2e:
    name: Browser end-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Build UI and run browser suite
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: test-results/

  container-smoke:
    name: Container build and offline startup smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose syntax
        run: docker compose -f docker-compose.yml config --quiet
      - name: Build production runtime (non-root, no credentials)
        run: docker build --target runtime -t mia:pr-smoke .
      - name: Boot isolated PAPER-locked offline server
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name mia-pr-smoke \
            -e MIA_OFFLINE=1 -e MIA_AUTH_MODE=passphrase mia:pr-smoke
          trap 'docker logs mia-pr-smoke || true; docker rm -f mia-pr-smoke || true' EXIT
          for attempt in {1..35}; do
            if docker exec mia-pr-smoke node server/scripts/health-probe.mjs; then
              docker exec mia-pr-smoke node -e "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
              exit 0
            fi
            sleep 2
          done
          echo "Container readiness did not pass within the smoke retry budget" >&2
          exit 1
