name: CI
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# Independent jobs (MA-05): a failing security job no longer hides typecheck, build or test results.
# Every job stays REQUIRED — the dependency audit is not suppressed, weakened or allowed to fail; it just runs alongside.
jobs:
  audit:
    name: Dependency audit (fail on high/critical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: All dependencies, including development tools
        run: npm audit --audit-level=high
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/secret-scan.mjs
  build:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Production build (web + compiled server)
        run: npm run build
  server-tests:
    name: Server unit & integration tests (offline, deterministic)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run qa -w server
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: data/qa/
  web-tests:
    name: Web unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -w web
  e2e:
    name: Browser end-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Build UI and run browser suite
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: test-results/

  mia5-isolated:
    name: MIA5 SHA-256 staging and CPU-isolated chaos tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Never execute the destructive original heredoc installer. Safely
      # stage all 12 exact source payloads outside canonical TypeScript.
      - name: Stage exact original 12 payloads without changing MIA
        run: node scripts/mia5-safe-stage.mjs --skip-tests
      - name: Verify idempotence (all 12 remain unchanged)
        run: |
          node scripts/mia5-safe-stage.mjs --skip-tests | tee /tmp/mia5-stage.log
          grep -q 'unchanged: 12' /tmp/mia5-stage.log
      - name: Run isolated deterministic MIA5 chaos contract suite
        run: node scripts/mia5-safe-stage.mjs
      - name: Audit canonical Hive coverage without trading authority
        run: npm run audit:hive
