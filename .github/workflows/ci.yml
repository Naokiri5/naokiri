name: CI
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Typecheck, unit tests, audit, secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # For PR events github.sha is GitHub's tested merge commit, not just the source head.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact tested commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Tested commit: $EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Secret scan
        run: node scripts/secret-scan.mjs
      - name: Dependency audit (fail on high/critical)
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Production build (web + compiled server)
        run: npm run build
      - name: Unit & integration tests (offline, deterministic)
        run: npm run qa -w server
      # Same local and CI P0 verification entrypoint, not a release certificate.
      - name: P0 reliability regressions (three shuffled runs)
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: bash scripts/verify-brainos-phases.sh --p0-only
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: p0-offline-verification-logs
          path: ${{ runner.temp }}/mia-brainos-verify.*/logs/
          if-no-files-found: ignore
          retention-days: 7
      - name: Web unit tests (status ribbon model)
        run: npm test -w web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: data/qa/test-results.json
  e2e:
    name: Browser end-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 20
    steps:
      # For PR events github.sha is GitHub's tested merge commit, not just the source head.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact tested commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Tested commit: $EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Build UI and run browser suite
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: test-results/
