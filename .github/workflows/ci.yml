name: CI
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_railway:
        description: 'Authorize Railway production deployment after maintenance and release gates are cleared'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'validation' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  checks:
    name: Typecheck, unit tests, audit, secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Secret scan
        run: node scripts/secret-scan.mjs
      - name: Dependency audit (fail on high/critical)
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Production build (web + compiled server)
        run: npm run build
      - name: Unit & integration tests (offline, deterministic)
        run: npm run qa -w server
      - name: Web unit tests (status ribbon model)
        run: npm test -w web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: data/qa/test-results.json
  e2e:
    name: Browser end-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Build UI and run browser suite
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: test-results/

  railway:
    name: Build and deploy MIA to Railway (manual)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_railway
    runs-on: ubuntu-latest
    needs: [checks, e2e]
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate deployment configuration
        env:
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
        run: |
          test -n "$RAILWAY_PROJECT_ID" || { echo "RAILWAY_PROJECT_ID is required"; exit 1; }
          if [ -f Dockerfile ]; then
            echo "Root Dockerfile found; reconcile the Railpack-only deployment configuration first."
            exit 1
          fi
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      # CI mode confirms the build, not runtime readiness. Inspect Railway
      # deployment status, health and storage before releasing maintenance.
      - name: Submit Railway deployment and stream build logs
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
        run: |
          test -n "$RAILWAY_TOKEN" || { echo "RAILWAY_TOKEN is required"; exit 1; }
          railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --service mia-web-api \
            --environment production \
            --ci
